# NOTE: Foundry is not currently used by this project. There are no .t.sol tests,
# no lib/ directory, and no remappings.txt; the full suite runs under Hardhat
# (`npm test`). This file is kept for a possible future Foundry setup.
#
# Keep solc_version in sync with hardhat.config.ts (currently 0.8.26). OpenZeppelin
# 5.6 requires >= 0.8.26, and its Bytes.sol uses the mcopy opcode, so evm_version
# must be cancun or later.

[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache_forge"

# Compiler settings
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Test settings
verbosity = 2
fuzz_runs = 1000
fuzz_max_test_rejects = 65536

# Gas settings
gas_limit = 12000000
gas_price = 30000000000

# RPC settings
eth_rpc_url = "http://localhost:8545"

# Formatter settings
line_length = 120
tab_width = 4
bracket_spacing = false

[profile.ci]
fuzz_runs = 10000

[profile.lite]
optimizer = false
fuzz_runs = 100