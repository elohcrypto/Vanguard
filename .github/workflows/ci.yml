name: CI

# Every branch push and every PR runs. A same-repo PR therefore runs twice
# (branch head and refs/pull/N/merge), accepted so the merge result is
# tested before merging. The concurrency groups differ (refs/heads/<b> vs
# refs/pull/N/merge), so neither cancels the other. Tag pushes do not run.
on:
  push:
    branches: ["**"]
  pull_request:

# The jobs only read the repo, the actions cache and this run's artifacts.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CIRCOM_VERSION: v2.2.3

# WALL-TIME TARGET: 40 minutes per run (owner decision Q12, plan v2 Task
# 5.10). One job ran every step in sequence until Task 5.10: 60-67 min.
# Now `compile` builds once and uploads the contract artifacts; `gates`
# needs nothing; tests, coverage, zk-coverage and demo run in parallel
# after compile, each starting with .github/actions/prepare. At 76ab084
# (run 38939602184) the run took 45:27: compile 2:14, coverage 43:07,
# tests 36:06, zk-coverage 25:10, demo 24:21. Since Task 5.15 tests and
# coverage run in two shards each and coverage-merge applies the
# coverage gates to the merge, so the critical path is compile plus the
# slowest of a shard (+ the ~1.5 min merge), zk-coverage and demo. Step
# bodies live in scripts/ci/; each job's timeout-minutes is a hang guard.
#
# Actions are pinned by commit SHA and updated by hand (no Dependabot
# here). Re-resolve a pin with `gh api repos/<owner>/<repo>/git/ref/tags/
# <tag>`; if `.object.type` is `tag` (annotated), follow `.object.url` to
# the commit SHA. No step uses git credentials, so none are left in
# .git/config. `npm ci` fails if package.json and package-lock.json
# disagree, the drift that broke this build before (an unbounded
# "typescript": ">=4.5.0" resolved to TypeScript 7 and crashed ts-node).

jobs:
  compile:
    # A branch deletion is also a push event (its SHA reverts to the default
    # branch; GitHub docs, "Events that trigger workflows", push) and must
    # not start a run. pull_request events have no `deleted`, so they run.
    # Every other job needs this one or carries the same condition.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm }
      - name: Install dependencies
        run: npm ci
      # Only the Rust compiler builds the circuits (scripts/ci/build-circom.sh).
      # This job saves the binary and the Powers of Tau (37.8 MB, from this
      # repo's releases; setup:zk verifies its BLAKE2b-512 whether cached or
      # fresh, and the key carries the hash prefix); the others restore them.
      - name: Cache circom binary
        id: circom-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/circom
          key: circom-${{ runner.os }}-${{ env.CIRCOM_VERSION }}
      - name: Build circom ${{ env.CIRCOM_VERSION }}
        if: steps.circom-cache.outputs.cache-hit != 'true'
        run: scripts/ci/build-circom.sh
      - name: Cache Powers of Tau
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/circuits/powersOfTau28_hez_final_15.ptau
          key: ptau-hez-final-15-982372c8
      - name: Compile contracts
        run: npx hardhat compile
      - name: Typecheck (tsc exits 0, no NEW tsc errors)
        run: scripts/ci/typecheck.sh
      # circom 2.x, setup:zk, the artifacts are real, verify:zk.
      - name: Build and verify ZK circuits
        run: scripts/ci/zk-circuits.sh
      - name: Upload compiled contracts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts
          path: |
            artifacts/
            cache/solidity-files-cache.json
            typechain-types/
          if-no-files-found: error
          retention-days: 1

  # Checkout-only gates, so no artifacts and no wait for compile.
  gates:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm }
      - name: Install dependencies
        run: npm ci
      # No setter or constructor may cast an address to a contract
      # interface without checking the address has code.
      - name: Audit setter/constructor guards
        run: node scripts/audit-setter-guards.js
      # Phase 4 exit row (4.15, D49; 4.17), Task 5.5 docs (file headers),
      # Task 5.15 shards (every test file in exactly one).
      - name: Exit gates (line count, scripts, names, free ids, docs, shards)
        run: |
          node scripts/ci/line-count-ratchet.js \
            && node scripts/ci/scripts-referenced.js \
            && node scripts/ci/deleted-names.js \
            && node scripts/ci/free-identifiers.js \
            && node scripts/ci/docs-gate.js \
            && node scripts/ci/test-shards.js check 2
      # Task 5.3: every guard site in contracts/ has a row in
      # test/guards/table/ (tested or unreachable); no bare revert.
      - name: Guard table (every require/revert classified)
        run: node scripts/ci/guards-table.js
      - name: Lint ratchet (no solhint errors, no NEW warnings)
        run: scripts/ci/lint-ratchet.sh
      - name: Audit dependencies (critical blocks)
        run: npm audit --audit-level=critical
      # Baseline and its history: scripts/ci/audit-baseline.json.
      - name: Audit ratchet (no NEW high vulnerabilities)
        run: node scripts/ci/audit-ratchet.js

  # Task 5.15 (L-6): the suite and the coverage run each in two shards
  # (scripts/ci/test-shards.js: every test file in exactly one shard).
  tests:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    name: tests (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: ./.github/actions/prepare
      # Slice A review HIGH-1: every passing test recorded (mocha-log.js),
      # so guard-runs binds the guard table's rows to tests that passed.
      - name: Run tests (this shard's files)
        run: TEST_SHARD=${{ matrix.shard }}/2 MOCHA_TIMINGS=$PWD/test-timings.log npm test
      - name: Upload the passing-test record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-timings-${{ matrix.shard }}
          path: test-timings.log
          if-no-files-found: error
          retention-days: 1
      # Task 4.15: the transfer-gas table (scripts/gas-analysis.ts) as a
      # recorded-baseline ratchet: a scenario more than 1,500 gas above its
      # recorded figure fails, a drop prints a notice. The hard gate stays
      # the in-test bound (VerificationCache: E <= A + 40,000).
      - name: Gas ratchet (transfer gas table)
        if: matrix.shard == 1
        run: npm run gas:claims

  # Slice A review HIGH-1: a tested guard row must name a test that
  # PASSED in the tests job, not only text in a file (a guard file
  # commented out, or a describe under `if (env)`, passed the static gate).
  guard-runs:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm }
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: test-timings-*, path: runs }
      - name: Guard table against the tests that passed
        run: node scripts/ci/guards-table.js --ran runs/test-timings-1/test-timings.log runs/test-timings-2/test-timings.log

  coverage:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2] }
    name: coverage (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: ./.github/actions/prepare
      # The run itself is a gate (no `|| true`); a test over 75% of its
      # mocha timeout fails it (scripts/ci/mocha-log.js).
      - name: Coverage shard (tests pass, near-timeout guard)
        run: scripts/ci/coverage-ratchet.sh --shard ${{ matrix.shard }} 2
      - name: Upload shard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload coverage logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-logs-${{ matrix.shard }}
          path: |
            coverage.log
            coverage-timings.log
            coverage-pending.log
          retention-days: 7

  # Baselines 97.4 lines and 91 branches, the instrumented set equal to
  # the tracked contracts minus .solcover.js skips (coverage-merge.js),
  # and the per-contract floors (scripts/ci/branch-floors.json) on the
  # shards' merged coverage.json.
  coverage-merge:
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm }
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: coverage-shard-*, path: shards }
      - name: Coverage ratchet (no DROP in merged line coverage)
        run: scripts/ci/coverage-ratchet.sh --merged 2 shards/*/coverage.json
      - name: Branch floors (contract run)
        run: node scripts/ci/branch-floors.js contracts coverage.json

  zk-coverage:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: ./.github/actions/prepare
      # PrivacyManager's proof-gated branches run only on real proofs.
      - name: Proof suites under coverage (ZK_PROOFS=1)
        run: scripts/ci/zk-coverage.sh
      - name: PrivacyManager branch gate (proof run floors)
        run: node scripts/ci/branch-floors.js proofs coverage.json
      - name: Upload proof coverage logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zk-coverage-logs
          path: |
            coverage-zk.log
            coverage-zk-timings.log
          retention-days: 7

  # The smoke's node serves every later step of this job, in order: the
  # CLI after its handover, the strict ceremony drive, then the
  # regression drives, which hardhat_reset it (so they run last).
  demo:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEMO_RPC_URL: http://127.0.0.1:8545
      DEMO_SMOKE_OUT: /tmp/demo-smoke-out.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: ./.github/actions/prepare
      - name: Demo deployment smoke test
        run: scripts/ci/demo-smoke.sh
      - name: Whitelist root + proof CLI
        run: scripts/ci/whitelist-cli.sh
      - name: Strict demo drive (complete ceremony, 83c/83d/83e)
        run: scripts/ci/strict-drive.sh
      - name: Production deploy drives (external signer; multisig roles)
        run: scripts/ci/deploy-drive.sh && scripts/ci/multisig-drive.sh
      # Six drives on fresh chains (4.17, 5.10), ~12.5 min locally.
      - name: Regression demo drives
        run: scripts/ci/regression-drives.sh
