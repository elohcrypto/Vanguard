name: CI

# Every branch push and every PR runs. A same-repo PR therefore runs twice
# (branch head and refs/pull/N/merge), accepted so the merge result is
# tested before merging. The concurrency groups differ (refs/heads/<b> vs
# refs/pull/N/merge), so neither cancels the other. Tag pushes do not run.
on:
  push:
    branches: ['**']
  pull_request:

# The job only reads the repo and the actions cache.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CIRCOM_VERSION: v2.2.3

jobs:
  build-and-test:
    # A branch deletion is also a push event (its SHA reverts to the default
    # branch; GitHub docs, "Events that trigger workflows", push) and must
    # not start a run. pull_request events have no `deleted`, so they run.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    # Measured: 16 min end to end at 19d75cb on a normal runner; a 1.7x
    # slower runner at 93f6fff needed ~28 min for tests + coverage alone;
    # the real-proof CLI tests (3.5) add ~3 min on 2 vCPU. This limit is a
    # hang guard, not a pace target.
    timeout-minutes: 60

    steps:
      # Actions are pinned by commit SHA and updated by hand (no Dependabot
      # here). Re-resolve a pin with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`; if `.object.type`
      # is `tag` (annotated), follow `.object.url` to the commit SHA.
      # No later step uses git credentials, so none are left in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # Fails if package.json and package-lock.json disagree, which is the
      # drift that broke this build before (an unbounded "typescript": ">=4.5.0"
      # resolved to TypeScript 7 and crashed ts-node).
      - name: Install dependencies
        run: npm ci

      # The circuits declare `pragma circom 2.0.0`; only the Rust compiler can
      # build them. The `circom` npm package is the deprecated 0.5.x JS build.
      - name: Cache circom binary
        id: circom-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/circom
          key: circom-${{ runner.os }}-${{ env.CIRCOM_VERSION }}

      - name: Build circom ${{ env.CIRCOM_VERSION }}
        if: steps.circom-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$CIRCOM_VERSION" https://github.com/iden3/circom.git /tmp/circom
          cargo build --release --manifest-path /tmp/circom/Cargo.toml
          mkdir -p ~/.cargo/bin
          cp /tmp/circom/target/release/circom ~/.cargo/bin/circom

      - name: Verify circom is 2.x
        run: |
          ~/.cargo/bin/circom --version
          ~/.cargo/bin/circom --version | grep -qE '\b2\.[0-9]+\.[0-9]+' \
            || { echo "::error::circom is not 2.x"; exit 1; }

      # 37.8 MB trusted-setup file, served from this repo's releases because
      # every public mirror now 403s. Cached so CI does not re-download each
      # run. setup:zk verifies the BLAKE2b-512 of whatever is on disk, cached
      # or fresh, so a bad cache entry is replaced rather than trusted. The
      # key carries the hash prefix: a different file is a different key.
      - name: Cache Powers of Tau
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/circuits/powersOfTau28_hez_final_15.ptau
          key: ptau-hez-final-15-982372c8

      # Static invariant: no setter or constructor may cast an address to a
      # contract interface without checking the address has code. Casting does
      # not validate, so a bad address is accepted here and reverts later inside
      # the dependency call, with no reason string. Exits 1 on any finding.
      # Runs before the build so a structural regression fails fast and cheap.
      - name: Audit setter/constructor guards
        run: node scripts/audit-setter-guards.js

      - name: Compile contracts
        run: npx hardhat compile

      # Ratchet, same shape as the audit ratchet below. tsc is not a hard gate
      # because ts-node strips types, so the suite never sees these. Fail only
      # when the count RISES. Baseline 0 (2026-10-02, was 98 then 1): Task 3.3
      # replaced the ZK integration test's dead validatePrivacyProofs call;
      # new TypeScript tests must type-check. Runs after compile because tsc
      # reads typechain-types/, which compile regenerates.
      - name: Typecheck ratchet (no NEW tsc errors)
        run: |
          BASELINE=0
          test -d typechain-types || { echo "::error::typechain-types/ missing; compile did not generate it"; exit 1; }
          npx tsc --noEmit --pretty false > tsc.log 2>&1 || true
          count=$(grep -c 'error TS' tsc.log || true)
          echo "tsc errors: $count (baseline $BASELINE)"
          if [ "$count" -gt "$BASELINE" ]; then
            echo "::error::tsc error count rose from $BASELINE to $count."
            grep 'error TS' tsc.log
            exit 1
          fi
          if [ "$count" -lt "$BASELINE" ]; then
            echo "::notice::tsc error count dropped to $count — lower BASELINE in ci.yml."
          fi

      # Solhint's own exit code is not a gate: it exits 0 on errors, and its
      # --max-warnings check is skipped when the first file reported has an
      # error. Its stdout is also truncated under a pipe (process.exit before
      # flush), so the report goes to a file and is counted from there. Any
      # error fails; warnings fail only when they RISE above the baseline.
      # Baseline 944 (2026-10-02, was 976; 965 measured after 3.2, 944 after
      # the Task 3.3 PrivacyManager rewrite).
      - name: Lint ratchet (no solhint errors, no NEW warnings)
        run: |
          BASELINE=944
          npx solhint -f unix 'contracts/**/*.sol' > solhint.log 2>&1 || true
          errors=$(grep -c '\[Error/' solhint.log || true)
          warnings=$(grep -c '\[Warning/' solhint.log || true)
          echo "solhint: $errors errors, $warnings warnings (warning baseline $BASELINE)"
          if [ "$errors" -gt 0 ]; then
            echo "::error::solhint reported $errors error(s)."
            grep '\[Error/' solhint.log
            exit 1
          fi
          if [ "$warnings" -gt "$BASELINE" ]; then
            echo "::error::solhint warning count rose from $BASELINE to $warnings."
            exit 1
          fi
          if [ "$warnings" -lt "$BASELINE" ]; then
            echo "::notice::solhint warnings dropped to $warnings — lower BASELINE in ci.yml."
          fi

      # `npm run` puts node_modules/.bin ahead of PATH, where the npm circom
      # 0.5.x shim lives. CIRCOM_BIN pins the real compiler explicitly.
      # $HOME rather than a literal path so this is not runner-specific.
      - name: Build ZK circuits
        run: CIRCOM_BIN="$HOME/.cargo/bin/circom" npm run setup:zk

      # Regression guard for the silent-mock bug: setup:zk used to write
      # placeholder files and overwrite the committed verifiers while exiting 0.
      - name: Assert ZK artifacts are real
        run: |
          fail=0
          for wasm in build/circuits/*/*_js/*.wasm; do
            magic=$(xxd -p -l4 "$wasm")
            if [ "$magic" != "0061736d" ]; then
              echo "::error::$wasm is not WebAssembly (magic $magic; 'mock' is 6d6f636b)"
              fail=1
            fi
          done
          if ! git diff --quiet contracts/privacy/verifiers/; then
            echo "::error::setup:zk modified committed verifier contracts"
            git diff --stat contracts/privacy/verifiers/
            fail=1
          fi
          exit $fail

      - name: Run tests
        run: npm test

      # Coverage ratchet. Baseline 88: measured at 88.55% lines on CI at
      # 19d75cb, 89.1% at 2e05e97, 89.17% at 15f26f3 (2026-10-03; earlier
      # baselines 63.73% -> 65 -> 84 -> 86 -> 88, each raised after the
      # notice fired).
      # Fails only when the number DROPS below BASELINE; notices when it climbs
      # 2+ points so the baseline can be raised. The plugin compiles instrumented
      # bytecode into artifacts/; nothing else may compile in this tree while it
      # runs, which is why this step follows "Run tests" rather than sharing it.
      # DEPLOY_GAS_LIMIT (set by the npm script) lifts one hard-coded 10M deploy
      # cap that instrumented initcode exceeds.
      - name: Coverage ratchet (no DROP in line coverage)
        run: |
          BASELINE=88
          npm run test:coverage > coverage.log 2>&1 || true
          lines=$(grep -E '^All files' coverage.log | awk -F'|' '{gsub(/ /,"",$5); print $5}')
          echo "line coverage: ${lines:-<none>}% (baseline $BASELINE)"
          if [ -z "$lines" ]; then
            echo "::error::coverage summary line not found; see coverage.log"
            tail -20 coverage.log
            exit 1
          fi
          if [ "$(printf '%s\n' "$lines" "$BASELINE" | sort -g | head -1)" != "$BASELINE" ]; then
            echo "::error::line coverage ${lines}% dropped below baseline ${BASELINE}%."
            exit 1
          fi
          if [ "$(printf '%s\n' "$lines" "$((BASELINE+2))" | sort -g | head -1)" = "$((BASELINE+2))" ]; then
            echo "::notice::line coverage ${lines}% is 2+ points above baseline — raise BASELINE in ci.yml."
          fi

      # The demo wires contracts together the way an operator would — a path the
      # unit tests do not cover. It cannot run interactively in CI (readline over
      # a non-TTY pipe closes before the first prompt), so this drives the same
      # ContractDeployer directly against a local node and reads the wiring back
      # from chain. Exits non-zero on any mismatch.
      - name: Demo deployment smoke test
        env:
          DEMO_SMOKE_OUT: /tmp/demo-smoke-out.json
        run: |
          npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -m 1 -X POST -H "Content-Type: application/json" \
                 --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
                 http://127.0.0.1:8545; then break; fi
            sleep 1
          done
          npx hardhat run scripts/demo-smoke.js --network localhost

      # Plan v2 Task 3.5: the operator and investor CLIs (scripts/zk/) against
      # the smoke's node, still running, after its handover. Three verified
      # wallets onboard (identity = OnchainID address, own secret), ops
      # (wallet 10, the listOperator) builds and publishes the root, wallet 2
      # proves and binds. VSC is in whitelist mode Either with no oracle, so
      # ComplianceRules.canReceive(wallet 2), called as VSC, follows the
      # binding: false before, true after. Hardhat's default keys.
      - name: Whitelist root + proof CLI
        run: |
          set -euo pipefail
          OUT=/tmp/demo-smoke-out.json
          RPC=http://127.0.0.1:8545
          D=$(mktemp -d)
          key() { node -e 'const { ethers } = require("ethers"); console.log(ethers.HDNodeWallet.fromPhrase("test test test test test test test test test test test junk", undefined, ethers.getIndexedAccountPath(+process.argv[1])).privateKey)' "$1"; }
          user() { jq -r ".users[] | select(.index == $1) | .$2" "$OUT"; }
          PM=$(jq -r .privacyManager "$OUT"); RULES=$(jq -r .complianceRules "$OUT"); VSC=$(jq -r .token "$OUT")
          echo '[]' > "$D/entries.json"
          for i in 1 2 3; do
            (umask 077; echo "0x$(openssl rand -hex 31)" > "$D/secret-$i")
            c=$(node scripts/zk/prove-whitelist.js --commitment --identity "$(user $i onchainID)" --secret-file "$D/secret-$i")
            jq --arg id "$(user $i onchainID)" --arg c "$c" '. + [{identity: $id, commitment: $c}]' "$D/entries.json" > "$D/e" && mv "$D/e" "$D/entries.json"
          done
          WHITELIST_OPS_KEY=$(key 10) node scripts/zk/build-whitelist-root.js \
            --in "$D/entries.json" --out "$D/root.json" --publish --rpc "$RPC" --privacy-manager "$PM"
          USER=$(user 2 wallet)
          gate() { node -e '
            const { ethers } = require("ethers");
            const [rpc, pm, rules, vsc, who] = process.argv.slice(1);
            const p = new ethers.JsonRpcProvider(rpc);
            const i = new ethers.Interface(["function hasValidWhitelistProof(address) view returns (bool)", "function canReceive(address) view returns (bool)"]);
            const call = async (to, f, from) => i.decodeFunctionResult(f, await p.call({ to, from, data: i.encodeFunctionData(f, [who]) }))[0];
            (async () => console.log(`${await call(pm, "hasValidWhitelistProof")} ${await call(rules, "canReceive", vsc)}`))()
              .catch((e) => { console.error(e.message); process.exit(1); });' "$RPC" "$PM" "$RULES" "$VSC" "$USER"; }
          before=$(gate); echo "before: hasValidWhitelistProof canReceive = $before"
          WHITELIST_SECRET=$(cat "$D/secret-2") WHITELIST_WALLET_KEY=$(key 2) node scripts/zk/prove-whitelist.js \
            --root "$D/root.json" --identity "$(user 2 onchainID)" --wallet "$USER" --out "$D/proof.json" \
            --submit --rpc "$RPC" --privacy-manager "$PM" > "$D/stdout" 2> "$D/stderr"
          cat "$D/stderr"
          after=$(gate); echo "after:  hasValidWhitelistProof canReceive = $after"
          for i in 1 2 3; do
            hex=$(sed 's/^0x//' "$D/secret-$i")
            dec=$(node -e 'console.log(BigInt(process.argv[1]).toString())' "0x$hex")
            for f in "$D/stdout" "$D/stderr"; do
              if grep -qiF -e "$hex" -e "$dec" "$f"; then echo "::error::the prover printed secret $i"; exit 1; fi
            done
          done
          if [ "$before" != "false false" ] || [ "$after" != "true true" ]; then
            echo "::error::expected 'false false' before and 'true true' after the binding"
            exit 1
          fi

      # Blocks on critical (currently 0).
      - name: Audit dependencies (critical blocks)
        run: npm audit --audit-level=critical

      # Ratchet. `npm audit fix` took highs 24 -> 22 on 2026-10-02; a rerun
      # (--dry-run) changes nothing. The 22, from `npm audit --json`:
      # - Hardhat 2 (11): hardhat, toolbox, hardhat-ethers, -chai-matchers,
      #   -network-helpers, -verify, @typechain/hardhat, contract-sizer,
      #   gas-reporter, adm-zip, undici. Fix: Hardhat 3 majors (toolbox
      #   7.0.0, chai-matchers 3.0.0, hardhat-ethers 4.2.0, network-helpers
      #   3.0.11, verify 3.1.2); typechain, sizer, gas-reporter list none.
      # - Coverage/test runners (3): solidity-coverage, mocha (8.4.0, 10.8.2,
      #   11.8.0), serialize-javascript (5.0.1, 6.0.2). Fix: downgrade to
      #   solidity-coverage 0.7.22 (major).
      # - ZK tooling (8), prod `dependencies` used off-chain only (proof
      #   scripts, tests): exact pins under circom 0.5 -> circom_runtime ->
      #   ffjavascript -> mocha 8.4.0 (js-yaml 4.0.0, minimatch 3.0.4, nanoid
      #   3.1.20); tmp 0.1.0 (tmp-promise; 0.0.33 is solc's, under hardhat);
      #   ws 8.18.0 (ethers 5 under circomlibjs); underscore 1.13.6, pinned
      #   by jsonpath, which taints jsonpath and bfj (snarkjs). npm's fixes
      #   leave the pins; clearing them needs overrides. `npm audit
      #   --omit=dev` reports 10: these 8 plus mocha 8.4.0's copies of mocha
      #   and serialize-javascript.
      # 22 -> 34 on 2026-10-03 (CI run 37090710733 at 15f26f3): advisories
      # published upstream against an unchanged tree (no dependency changed;
      # an install from days earlier reports 34 too). `npm audit fix
      # --dry-run` (non-breaking) only adds fsevents and leaves 34. The 12
      # new highs, by chain:
      # - @fastify/busboy (GHSA-x8mw-p69m-v3mx), under undici under hardhat
      #   and hardhat-verify (1). Fix: the Hardhat 3 majors above (npm
      #   offers solidity-coverage 0.7.22).
      # - braces (GHSA-vfj7-8cjw-p6xm) -> micromatch -> fast-glob -> globby
      #   -> solidity-coverage, and braces -> chokidar -> mocha (the copies
      #   under solidity-coverage, eth-gas-reporter, circom_runtime) (5:
      #   braces, micromatch, fast-glob, globby, chokidar). Fix: the
      #   solidity-coverage major above; circom_runtime's needs overrides.
      # - http-cache-semantics (GHSA-ch52-4w7c-c8xp) -> cacheable-request ->
      #   got -> package-json -> latest-version -> solhint (6). Fix: npm
      #   offers solhint 3.6.2 (major downgrade).
      # The same audit lists further highs on packages already in the 22
      # (js-yaml, minimatch, nanoid, undici, ws, tmp, underscore,
      # serialize-javascript, adm-zip); the count is per package, so they
      # do not move it.
      # The count is checked against the live advisory database, so a newly
      # published advisory in an unchanged dependency reddens every branch
      # at once; raise BASELINE with the advisory recorded here.
      # Gating on `high` would be permanently red and quickly ignored. Instead
      # fail only when the count RISES above the recorded baseline, so a newly
      # introduced high is caught while the known backlog stays visible.
      - name: Audit ratchet (no NEW high vulnerabilities)
        run: |
          BASELINE=34
          count=$(npm audit --json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                console.log(JSON.parse(s).metadata.vulnerabilities.high)})")
          echo "high vulnerabilities: $count (baseline $BASELINE)"
          if [ "$count" -gt "$BASELINE" ]; then
            echo "::error::High-severity count rose from $BASELINE to $count."
            npm audit --audit-level=high || true
            exit 1
          fi
          if [ "$count" -lt "$BASELINE" ]; then
            echo "::notice::High count dropped to $count — lower BASELINE in ci.yml."
          fi
