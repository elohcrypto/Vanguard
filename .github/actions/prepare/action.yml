# Every job after `compile` starts the same way (Task 5.15 moved the steps
# here from four copies in ci.yml): Node and npm ci, the contract artifacts
# compile uploaded, the circom binary and Powers of Tau compile cached, and
# the circuits rebuilt and verified (scripts/ci/zk-circuits.sh, ~30 s;
# cheaper than downloading ~400 MB of zkeys). The caller checks out first.
name: prepare
description: Node, npm ci, compiled contracts, circom, Powers of Tau, circuits
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with: { node-version: "22", cache: npm }
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Download compiled contracts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with: { name: contracts }
    - name: Restore circom binary
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/bin/circom
        key: circom-${{ runner.os }}-${{ env.CIRCOM_VERSION }}
        fail-on-cache-miss: true
    - name: Restore Powers of Tau
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/circuits/powersOfTau28_hez_final_15.ptau
        key: ptau-hez-final-15-982372c8
    - name: Build and verify ZK circuits
      run: scripts/ci/zk-circuits.sh
      shell: bash
    # Review D-4 round 3: the signer lock's PID-namespace tests start a
    # signer under `unshare -Upf --map-root-user`, which Ubuntu 24.04's
    # AppArmor confines for unprivileged users.
    - name: Allow unprivileged user namespaces
      run: |
        f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
        if [[ -e $f ]]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      shell: bash
